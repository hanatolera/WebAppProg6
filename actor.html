<!DOCTYPE html>
<html>

<head>
    <title>Actor Guessing Game</title>
</head>

<body>

    <h2>Actors by Hana Tolera</h2>

    <form>
        <label for="actor">Peter Pan</label>
        <input type="password" id="actor" value="Robin Williams"> <br>

        <label for="guess">Who is the actor</label>
        <input type="text" id="guess"> <br>

        <input type="button" onclick="checkActor()" value="Check the guess">
    </form>


    <p id="result">This text will be replaced </p>
    <div>
        <img id="foodPic" src="Lasagna.jpg" width="150" height="150" onclick="updatePic()">
    </div>

    <script>
        let correct = 0;
        let notCorrect = 0;
        let usePic = 1;
        function checkActor() {
            actor = document.getElementById("actor").value;
            guess = document.getElementById("guess").value;

            if (actor == guess) {
                correct = correct + 1;
                alert("That's right");
            } else {
                notCorrect = notCorrect + 1;
                alert("Better luck next time");
            }

            document.getElementById("result").innerHTML =
                "Correct: " + correct + " Not Correct: " + notCorrect;
        }

        function updatePic() {
            switch (usePic) {
                case 1:
                    document.getElementById("foodPic").src = "Rice.jpg";
                    usePic = 2;
                    break;

                case 2:
                    document.getElementById("foodPic").src = "Tacos.jpg";
                    usePic = 3;
                    break;

                case 3:
                    document.getElementById("foodPic").src = "Lasagna.jpg";
                    usePic = 1;
                    break;
            }
        }


    </script>

</body>

</html>
